<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Microsoft YaHei",sans-serif;
  background:#111;
  color:white;
}

h1{
  text-align:center;
  font-size:48px;
  margin:20px 0;
}

.main{
  display:flex;
  height:100vh;
}

/* LEFT SIDE */
.left{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* WHEEL */
#wheelBox{
  position:relative;
}

#wheel{
  width:600px;
  height:600px;
  border-radius:50%;
  border:12px solid white;
  background:conic-gradient(
    #ff5252 0deg 7.6deg,
    #ffca28 7.6deg 15.2deg,
    #66bb6a 15.2deg 22.8deg,
    #42a5f5 22.8deg 30.4deg,
    #ab47bc 30.4deg 38deg
  );
}

/* POINTER */
.pointer{
  position:absolute;
  top:50%;
  left:100%;
  transform:translate(-10%,-50%) rotate(180deg);
  width:0;
  height:0;
  border-top:25px solid transparent;
  border-bottom:25px solid transparent;
  border-left:50px solid red;
}

/* BUTTON */
button{
  margin-top:30px;
  padding:18px 60px;
  font-size:28px;
  border:none;
  border-radius:10px;
  background:#ff5252;
  color:white;
  cursor:pointer;
}

/* RESULT */
#result{
  margin-top:25px;
  font-size:36px;
  font-weight:bold;
  color:#ffca28;
}

/* RIGHT LIST */
.right{
  width:320px;
  overflow:auto;
  border-left:3px solid #444;
  padding:20px;
}

.right h2{
  text-align:center;
}

.name{
  padding:8px;
  border-bottom:1px solid #333;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🎡 初三4 抽签转盘</h1>

<div class="main">

<div class="left">

<div id="wheelBox">
  <div id="wheel"></div>
  <div class="pointer"></div>
</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

</div>

<div class="right">
<h2>名单</h2>
<div id="list"></div>
</div>

</div>

<script>
const students=[
{no:1,name:"邱穆芸"},
{no:2,name:"陈妍希"},
{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},
{no:5,name:"颜姿彤"},
{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},
{no:8,name:"陈钏宁"},
{no:9,name:"李静恩"},
{no:10,name:"李开心"},
{no:11,name:"刘瑞恩"},
{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},
{no:14,name:"陈姿卉"},
{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},
{no:17,name:"潘姿颖"},
{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},
{no:20,name:"戴湘霖"},
{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},
{no:23,name:"朱俊绅"},
{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},
{no:26,name:"张智勇"},
{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},
{no:29,name:"江致承"},
{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},
{no:32,name:"刘宽辅"},
{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},
{no:35,name:"伍思源"},
{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},
{no:38,name:"陈晋佑"},
{no:39,name:"陈有权"},
{no:40,name:"余根权"},
{no:41,name:"黄凯杰"},
{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},
{no:44,name:"黄明杰"},
{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},
{no:47,name:"杨仁喆"}
];

const wheel=document.getElementById("wheel");
let angle=0;
let idleSpin=true;

/* idle spin */
setInterval(()=>{
 if(idleSpin){
   angle+=0.1;
   wheel.style.transform=`rotate(${angle}deg)`;
 }
},30);

/* list */
let html="";
students.forEach(s=>{
 html+=`<div class="name">${s.no}. ${s.name}</div>`;
});
document.getElementById("list").innerHTML=html;

/* spin */
function spin(){
 idleSpin=false;
 let target=Math.random()*360+3600;
 let start=angle;
 let t=0;
 let timer=setInterval(()=>{
   t+=0.02;
   angle=start+(target-start)*easeOut(t);
   wheel.style.transform=`rotate(${angle}deg)`;
   if(t>=1){
     clearInterval(timer);
     showResult();
     idleSpin=true;
   }
 },16);
}

function easeOut(t){
 return 1-Math.pow(1-t,3);
}

function showResult(){
 let deg=(360-angle%360+90)%360;
 let index=Math.floor(deg/(360/students.length));
 let s=students[index];
 document.getElementById("result").innerHTML=
 `🎉 抽中：${s.no} ${s.name}`;
}
</script>

</body>
</html>
