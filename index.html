<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>抽签转盘</title>

<style>
body{
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  background:#111;
  color:white;
  font-family:"Microsoft YaHei";
}

h1{
  font-size:40px;
  margin-bottom:20px;
}

#wheelBox{
  position:relative;
}

#wheel{
  width:500px;
  height:500px;
  border-radius:50%;
  border:10px solid white;
}

.pointer{
  position:absolute;
  top:50%;
  left:100%;
  transform:translate(-5%,-50%) rotate(180deg);
  width:0;
  height:0;
  border-top:20px solid transparent;
  border-bottom:20px solid transparent;
  border-left:40px solid red;
}

button{
  margin-top:30px;
  padding:15px 50px;
  font-size:24px;
  border:none;
  border-radius:10px;
  background:#ff5252;
  color:white;
  cursor:pointer;
}

#resultBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:#222;
  padding:40px 80px;
  border-radius:20px;
  font-size:36px;
  color:#ffca28;
  box-shadow:0 0 30px rgba(0,0,0,.6);
  transition:.3s;
}

#resultBox.show{
  transform:translate(-50%,-50%) scale(1.15);
}
</style>
</head>

<body>

<h1>🎡 抽签转盘</h1>

<div id="wheelBox">
  <div id="wheel"></div>
  <div class="pointer"></div>
</div>

<button onclick="spin()">SPIN</button>

<div id="resultBox"></div>

<script>
const students=[
{no:1,name:"邱穆芸"},
{no:2,name:"陈妍希"},
{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},
{no:5,name:"颜姿彤"},
{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},
{no:8,name:"陈钏宁"},
{no:9,name:"李静恩"},
{no:10,name:"李开心"},
{no:11,name:"刘瑞恩"},
{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},
{no:14,name:"陈姿卉"},
{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},
{no:17,name:"潘姿颖"},
{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},
{no:20,name:"戴湘霖"},
{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},
{no:23,name:"朱俊绅"},
{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},
{no:26,name:"张智勇"},
{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},
{no:29,name:"江致承"},
{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},
{no:32,name:"刘宽辅"},
{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},
{no:35,name:"伍思源"},
{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},
{no:38,name:"陈晋佑"},
{no:39,name:"陈有权"},
{no:40,name:"余根权"},
{no:41,name:"黄凯杰"},
{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},
{no:44,name:"黄明杰"},
{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},
{no:47,name:"杨仁喆"}
];

const wheel=document.getElementById("wheel");
const box=document.getElementById("resultBox");
let angle=0;

/* build wheel */
let deg=360/students.length;
let g=[];
for(let i=0;i<students.length;i++){
 let c=`hsl(${i*360/students.length},80%,55%)`;
 g.push(`${c} ${i*deg}deg ${(i+1)*deg}deg`);
}
wheel.style.background=`conic-gradient(${g.join(",")})`;

function spin(){
 box.classList.remove("show");

 let target=Math.random()*360+3600;
 let start=angle;
 let t=0;

 let timer=setInterval(()=>{
   t+=0.02;
   angle=start+(target-start)*(1-Math.pow(1-t,3));
   wheel.style.transform=`rotate(${angle}deg)`;

   if(t>=1){
     clearInterval(timer);
     showResult();
   }
 },16);
}

function showResult(){
 let size=360/students.length;
 let deg=(360-angle%360+90)%360;
 let index=Math.floor(deg/size);
 let s=students[index];

 box.innerHTML=`🎉 抽中：${s.no} ${s.name}`;
 box.classList.add("show");
}
</script>

</body>
</html>
