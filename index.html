<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 转盘</title>
<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:#111;
  color:white;
}

h1{
  margin-top:20px;
}

#wheelCanvas{
  margin-top:20px;
  background:white;
  border-radius:50%;
}

button{
  margin-top:20px;
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
  border:none;
  border-radius:10px;
}

#result{
  margin-top:20px;
  font-size:22px;
  color:yellow;
}
</style>
</head>
<body>

<h1>初三4 班级转盘</h1>

<canvas id="wheelCanvas" width="400" height="400"></canvas>

<br>
<button onclick="spin()">🎡 旋转</button>

<div id="result"></div>

<script>
const names = [
"01 邱穆芸","02 陈妍希","03 张芷欣","04 杨时瑜","05 颜姿彤","06 许亦萱","07 陈嘉恩","08 陈钏宁","09 李静恩","10 李开心",
  "11 刘瑞恩","12 黄禹嫣","13 妮娅","14 陈姿卉","15 何汶宣","16 王歆茹","17 潘姿颖","18 施凯馨","19 陈渝恩","20 戴湘霖",
  "21 王婧涵","22 许悦影","23 朱俊绅","24 陈毅祥","25 谢承邑","26 张智勇","27 何凯旭","28 赖家禾","29 江致承","30 刘俊祥",
  "31 卢隽益","32 刘宽辅","33 卢裕城","34 黄康桀","35 伍思源","36 彭宇乐","37 潘家扬","38 陈晋佑","39 陈有权","40 余根权",
  "41 黄凯杰","42 黄恩杰","43 黄俊熹","44 黄明杰","45 叶峻睿","46 叶礼诚","47 杨仁喆"
];

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");

const colors = ["#ff4d4d","#4d79ff","#4dff88","#ffd24d"];

let angle = 0;

function drawWheel(){
  const arc = Math.PI * 2 / names.length;

  for(let i=0;i<names.length;i++){
    let start = angle + i * arc;

    ctx.beginPath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.moveTo(200,200);
    ctx.arc(200,200,200,start,start+arc);
    ctx.fill();

    ctx.save();
    ctx.translate(200,200);
    ctx.rotate(start + arc/2);
    ctx.textAlign="right";
    ctx.fillStyle="black";
    ctx.font="14px Arial";
    ctx.fillText(names[i],180,10);
    ctx.restore();
  }
}

function spin(){
  let spinAngle = Math.random()*2000 + 3000;

  let start = Date.now();

  function animate(){
    let progress = Date.now() - start;

    angle += (spinAngle - progress)/10000;

    ctx.clearRect(0,0,400,400);
    drawWheel();

    if(progress < spinAngle){
      requestAnimationFrame(animate);
    }else{
      showResult();
    }
  }

  animate();
}

function showResult(){
  const arc = Math.PI * 2 / names.length;
  let index = Math.floor(((2*Math.PI - angle%(2*Math.PI)) / arc)) % names.length;

  document.getElementById("result").innerText =
    "🎉 选中：" + names[index];
}

drawWheel();
</script>

</body>
</html>
