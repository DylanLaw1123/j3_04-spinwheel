<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  margin:0;
  font-family:"Microsoft YaHei",sans-serif;
  background:#f3f4f6;
  display:flex;
  height:100vh;
}

.left{
  flex:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.right{
  flex:1;
  background:white;
  padding:20px;
  overflow-y:auto;
  border-left:3px solid #ddd;
}

h1{font-size:36px;}

#wheelBox{ position:relative; }

#wheel{
  width:520px;
  height:520px;
  border-radius:50%;
  border:12px solid #333;
  transition:transform 4s cubic-bezier(.17,.67,.12,.99);
}

/* POINTER (LEFT SIDE, ROTATED 180°) */
#pointer{
  position:absolute;
  left:-45px;
  top:50%;
  transform:translateY(-50%) rotate(180deg);
  width:0;height:0;
  border-top:18px solid transparent;
  border-bottom:18px solid transparent;
  border-left:35px solid red;
}

button{
  margin-top:30px;
  padding:18px 50px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

#popup{
  position:fixed;
  display:none;
  background:#facc15;
  padding:50px 90px;
  border-radius:26px;
  font-size:48px;
  font-weight:bold;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:999;
  text-align:center;
}

/* LIST */
.list h2{text-align:center;}
.list div{
  padding:10px;
  border-bottom:1px solid #eee;
}
.active{
  background:#fde047;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="left">
<h1>🎡 初三4 抽签转盘</h1>

<div id="wheelBox">
<canvas id="wheel" width="520" height="520"></canvas>
<div id="pointer"></div>
<div id="popup"></div>
</div>

<button onclick="spin()">SPIN</button>
</div>

<div class="right">
<div class="list">
<h2>📋 学生名单</h2>
<div id="list"></div>
</div>
</div>

<script>
const students=[
{no:1,name:"邱穆芸"},{no:2,name:"陈妍希"},{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},{no:5,name:"颜姿彤"},{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},{no:8,name:"陈钏宁"},{no:9,name:"李静恩"},
{no:10,name:"李开心"},{no:11,name:"刘瑞恩"},{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},{no:14,name:"陈姿卉"},{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},{no:17,name:"潘姿颖"},{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},{no:20,name:"戴湘霖"},{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},{no:23,name:"朱俊绅"},{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},{no:26,name:"张智勇"},{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},{no:29,name:"江致承"},{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},{no:32,name:"刘宽辅"},{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},{no:35,name:"伍思源"},{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},{no:38,name:"陈晋佑"},{no:39,name:"陈有权"},
{no:40,name:"余根权"},{no:41,name:"黄凯杰"},{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},{no:44,name:"黄明杰"},{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},{no:47,name:"杨仁喆"}
];

const wheel=document.getElementById("wheel");
const ctx=wheel.getContext("2d");
const popup=document.getElementById("popup");
const listDiv=document.getElementById("list");

const size=students.length;
const slice=360/size;
let current=0;
let spinning=false;

/* DRAW WHEEL + BIG NAMES */
function draw(){
  for(let i=0;i<size;i++){
    ctx.beginPath();
    ctx.moveTo(260,260);
    ctx.fillStyle=i%2?"#60a5fa":"#93c5fd";
    ctx.arc(260,260,260,
      i*2*Math.PI/size,
      (i+1)*2*Math.PI/size
    );
    ctx.fill();

    ctx.save();
    ctx.translate(260,260);
    ctx.rotate(i*2*Math.PI/size + Math.PI/size);
    ctx.textAlign="right";
    ctx.fillStyle="#000";
    ctx.font="bold 20px Microsoft YaHei"; // BIGGER TEXT
    ctx.fillText(
      students[i].no+" "+students[i].name,
      240,8
    );
    ctx.restore();
  }
}
draw();

/* LIST */
students.forEach((s,i)=>{
  listDiv.innerHTML+=`<div id="stu${i}">${s.no}. ${s.name}</div>`;
});

/* SPIN */
function spin(){
  if(spinning) return;
  spinning=true;
  popup.style.display="none";

  document.querySelectorAll(".active")
  .forEach(e=>e.classList.remove("active"));

  let extra=Math.random()*360;
  current+=360*6+extra;
  wheel.style.transform=`rotate(${current}deg)`;
}

/* STOP → RESULT */
wheel.addEventListener("transitionend",()=>{
  if(!spinning) return;

  let final=(current%360+360)%360;

  /* POINTER ON LEFT (180deg) */
  let pointerDeg=(180-final+360)%360;
  let index=Math.floor(pointerDeg/slice);

  let winner=students[index];

  popup.innerHTML=`🎉 抽中<br>${winner.no} ${winner.name}`;
  popup.style.display="block";

  document.getElementById("stu"+index)
  .classList.add("active");

  spinning=false;
});
</script>

</body>
</html>
