<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  font-family:"Microsoft YaHei",sans-serif;
  background:#f4f6f9;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

#wheel-container{
  position: relative;
  width:400px;
  height:400px;
}

canvas{
  border-radius:50%;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
}

/* pointer */
.pointer{
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%) rotate(180deg);
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid red;
  z-index:10;
}

button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  font-size:18px;
  cursor:pointer;
}

#result{
  margin-top:20px;
  font-size:26px;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🎡 抽签转盘</h1>

<div id="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
</div>

<button onclick="spin()">开始抽签</button>
<div id="result"></div>

<script>
const students=[
{no:1,name:"邱穆芸"},
{no:2,name:"陈妍希"},
{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},
{no:5,name:"颜姿彤"},
{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},
{no:8,name:"陈钏宁"},
{no:9,name:"李静恩"},
{no:10,name:"李开心"},
{no:11,name:"刘瑞恩"},
{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},
{no:14,name:"陈姿卉"},
{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},
{no:17,name:"潘姿颖"},
{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},
{no:20,name:"戴湘霖"},
{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},
{no:23,name:"朱俊绅"},
{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},
{no:26,name:"张智勇"},
{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},
{no:29,name:"江致承"},
{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},
{no:32,name:"刘宽辅"},
{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},
{no:35,name:"伍思源"},
{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},
{no:38,name:"陈晋佑"},
{no:39,name:"陈有权"},
{no:40,name:"余根权"},
{no:41,name:"黄凯杰"},
{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},
{no:44,name:"黄明杰"},
{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},
{no:47,name:"杨仁喆"}
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = students.length;
const angle = 2*Math.PI/size;

let rotation = 0;
let spinning = false;
let idle = true;

/* draw wheel */
function draw(){
  ctx.clearRect(0,0,400,400);
  students.forEach((s,i)=>{
    ctx.beginPath();
    ctx.moveTo(200,200);
    ctx.fillStyle = `hsl(${i*360/size},80%,70%)`;
    ctx.arc(200,200,200,i*angle+rotation,(i+1)*angle+rotation);
    ctx.fill();

    ctx.save();
    ctx.translate(200,200);
    ctx.rotate(i*angle+angle/2+rotation);
    ctx.textAlign="right";
    ctx.fillStyle="#000";
    ctx.font="14px Microsoft YaHei";
    ctx.fillText(`${s.no} ${s.name}`,180,5);
    ctx.restore();
  });
}

/* slow idle spin */
function idleSpin(){
  if(!idle) return;
  rotation += 0.003;
  draw();
  requestAnimationFrame(idleSpin);
}

/* real spin */
function spin(){
  if(spinning) return;

  idle = false;
  spinning = true;

  let totalRotation = Math.random()*Math.PI*4 + Math.PI*8;
  const start = performance.now();
  const duration = 5000;

  function animate(now){
    let progress = (now-start)/duration;
    if(progress>1) progress=1;

    let eased = 1 - Math.pow(1-progress,3);
    rotation = totalRotation * eased;

    draw();

    if(progress<1){
      requestAnimationFrame(animate);
    }else{
      spinning = false;

      let index = Math.floor(((1.5*Math.PI-rotation)%(2*Math.PI))/angle);
      if(index<0) index += size;

      const s = students[index];
      document.getElementById("result").innerHTML =
        `🎉 抽中：${s.no} ${s.name}`;
    }
  }

  requestAnimationFrame(animate);
}

/* start idle */
draw();
idleSpin();
</script>

</body>
</html>
