<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🎡 初三4 抽签转盘</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}
.container{
  display:flex;
  height:100vh;
}

/* LEFT */
.left{
  flex:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* WHEEL */
#wheelBox{
  position:relative;
  width:520px;
  height:520px;
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:12px solid white;
  transition:transform 4s cubic-bezier(.17,.67,.23,1);
}

/* POINTER */
.pointer{
  position:absolute;
  top:50%;
  right:-55px;
  transform:translateY(-50%) rotate(180deg);
  width:0;height:0;
  border-top:25px solid transparent;
  border-bottom:25px solid transparent;
  border-right:50px solid red;
}

/* BUTTON */
button{
  margin-top:30px;
  font-size:28px;
  padding:12px 50px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* RIGHT LIST */
.right{
  flex:1;
  background:#222;
  padding:20px;
  overflow:auto;
}
.right h2{
  text-align:center;
}
.list{
  line-height:2;
  font-size:20px;
}

/* POPUP */
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}
#box{
  background:white;
  color:black;
  padding:40px;
  border-radius:15px;
  font-size:30px;
  text-align:center;
}
</style>
</head>
<body>

<div class="container">

<!-- LEFT -->
<div class="left">
<h1>🎡 初三4 抽签转盘</h1>

<div id="wheelBox">
<canvas id="wheel" width="520" height="520"></canvas>
<div class="pointer"></div>
</div>

<button onclick="spin()">SPIN</button>
</div>

<!-- RIGHT -->
<div class="right">
<h2>名单</h2>
<div class="list" id="list"></div>
</div>

</div>

<!-- POPUP -->
<div id="popup">
<div id="box"></div>
</div>

<script>
const data=[
{no:1,name:"邱穆芸"},
{no:2,name:"陈妍希"},
{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},
{no:5,name:"颜姿彤"},
{no:6,name:"许亦萱"},
{no:7,name:"卢隽益"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const total=data.length;
const angle=2*Math.PI/total;

/* draw wheel */
function draw(){
  for(let i=0;i<total;i++){
    ctx.beginPath();
    ctx.moveTo(260,260);
    ctx.arc(260,260,260,i*angle,(i+1)*angle);
    ctx.fillStyle=`hsl(${i*360/total},80%,55%)`;
    ctx.fill();

    ctx.save();
    ctx.translate(260,260);
    ctx.rotate(i*angle+angle/2);
    ctx.textAlign="right";
    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText(
      data[i].no+" "+data[i].name,
      240,8
    );
    ctx.restore();
  }
}
draw();

/* list */
let list=document.getElementById("list");
data.forEach(d=>{
  list.innerHTML+=`${d.no} ${d.name}<br>`;
});

let rot=0;
let spinning=false;

function spin(){
  if(spinning) return;
  spinning=true;

  let r=Math.floor(Math.random()*total);
  let stop=360*5 - (r*360/total + 360/total/2);

  rot+=stop;
  canvas.style.transform=`rotate(${rot}deg)`;

  setTimeout(()=>{
    document.getElementById("box").innerHTML=
      `🎉 抽中：${data[r].no} ${data[r].name}`;
    document.getElementById("popup").style.display="flex";
    spinning=false;
  },4200);
}

/* close popup */
document.getElementById("popup").onclick=()=>{
  document.getElementById("popup").style.display="none";
};
</script>

</body>
</html>
