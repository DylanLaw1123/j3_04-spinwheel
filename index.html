<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  background:#fff;
  margin:0;
}

header{
  text-align:center;
  font-size:40px;
  font-weight:bold;
  padding:10px;
}

/* layout */
#layout{
  display:flex;
  height:calc(100vh - 80px);
}

/* wheel area */
#wheelBox{
  flex:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* list area */
#listBox{
  flex:1;
  border-left:2px solid #eee;
  padding:15px;
  overflow-y:auto;
}

#listBox h2{
  text-align:center;
}

.item{
  padding:8px 10px;
  border-bottom:1px solid #eee;
  font-size:18px;
}

/* wheel */
#wrapper{
  position:relative;
  width:650px;
  height:650px;
}

.pointer{
  position:absolute;
  right:-35px;
  top:50%;
  transform:translateY(-50%) rotate(180deg); /* <<< ROTATED 180 */
  width:0;height:0;
  border-top:25px solid transparent;
  border-bottom:25px solid transparent;
  border-left:45px solid red;
}

canvas{
  border-radius:50%;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* buttons */
.controls{
  margin-top:15px;
}

button{
  padding:12px 35px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#1976d2;
  color:white;
  cursor:pointer;
  margin:0 5px;
}

button:hover{background:#125aa0}

/* result */
#result{
  font-size:42px;
  font-weight:bold;
  margin-top:15px;
  opacity:0;
  transform:scale(.5);
  transition:.4s;
}
#result.show{
  opacity:1;
  transform:scale(1.1);
}
</style>
</head>
<body>

<header>🎡 初三4 抽签转盘</header>

<div id="layout">

<div id="wheelBox">

<div id="wrapper">
  <div class="pointer"></div>
  <canvas id="wheel" width="650" height="650"></canvas>
</div>

<div class="controls">
  <button onclick="spin()">SPIN</button>
  <button onclick="fullscreen()">FULL SCREEN</button>
</div>

<div id="result"></div>

</div>

<div id="listBox">
  <h2>📜 名单</h2>
  <div id="list"></div>
</div>

</div>

<script>
const students=[
{no:1,name:"邱穆芸"},{no:2,name:"陈妍希"},{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},{no:5,name:"颜姿彤"},{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},{no:8,name:"陈钏宁"},{no:9,name:"李静恩"},
{no:10,name:"李开心"},{no:11,name:"刘瑞恩"},{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},{no:14,name:"陈姿卉"},{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},{no:17,name:"潘姿颖"},{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},{no:20,name:"戴湘霖"},{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},{no:23,name:"朱俊绅"},{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},{no:26,name:"张智勇"},{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},{no:29,name:"江致承"},{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},{no:32,name:"刘宽辅"},{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},{no:35,name:"伍思源"},{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},{no:38,name:"陈晋佑"},{no:39,name:"陈有权"},
{no:40,name:"余根权"},{no:41,name:"黄凯杰"},{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},{no:44,name:"黄明杰"},{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},{no:47,name:"杨仁喆"}
];

let listHTML="";
students.forEach(s=>{
 listHTML+=`<div class="item">${s.no}. ${s.name}</div>`;
});
document.getElementById("list").innerHTML=listHTML;

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const r=canvas.width/2;
let angle=0;
let spinning=false;

function draw(){
 let per=2*Math.PI/students.length;
 ctx.clearRect(0,0,canvas.width,canvas.height);

 students.forEach((s,i)=>{
  let a=angle+i*per;
  ctx.beginPath();
  ctx.moveTo(r,r);
  ctx.arc(r,r,r,a,a+per);
  ctx.fillStyle=`hsl(${i*360/students.length},85%,65%)`;
  ctx.fill();

  ctx.save();
  ctx.translate(r,r);
  ctx.rotate(a+per/2);
  ctx.textAlign="right";
  ctx.fillStyle="#222";
  ctx.font="20px Segoe UI";
  ctx.fillText(`${s.no} ${s.name}`,r-22,8);
  ctx.restore();
 });
}

function idle(){
 if(!spinning){
  angle+=0.0015;
  draw();
 }
 requestAnimationFrame(idle);
}

function spin(){
 if(spinning) return;
 spinning=true;
 document.getElementById("result").className="";

 let speed=0.45;
 function go(){
  angle+=speed;
  speed*=0.985;
  draw();
  if(speed>0.002){
    requestAnimationFrame(go);
  }else{
    spinning=false;
    showResult();
  }
 }
 go();
}

function showResult(){
 let per=2*Math.PI/students.length;
 let idx=Math.floor(((2*Math.PI-angle)%(2*Math.PI))/per);
 let s=students[idx];

 let box=document.getElementById("result");
 box.innerHTML=`🎉 抽中：${s.no} ${s.name}`;
 setTimeout(()=>box.className="show",50);
}

function fullscreen(){
 let el=document.documentElement;
 if(el.requestFullscreen){
  el.requestFullscreen();
 }
}

draw();
idle();
</script>

</body>
</html>
