const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const size=students.length;
const angle=2*Math.PI/size;
let rotation=0;

function draw(){
  for(let i=0;i<size;i++){
    const start=i*slice;
    const mid=start+slice/2;

    // slice
    ctx.beginPath();
    ctx.moveTo(260,260);
    ctx.fillStyle=colors[i%colors.length];
    ctx.arc(260,260,260,start,start+slice);
    ctx.fill();

    // text horizontal inside slice
    ctx.save();
    ctx.translate(260,260);
    ctx.rotate(mid); // rotate to slice center
    ctx.textAlign="center";
    ctx.fillStyle="#fff";
    ctx.font="bold 14px Microsoft YaHei";

    // draw text along radius, centered inside slice
    const textRadius = 200; // distance from center
    ctx.rotate(Math.PI/2); // horizontal along radius
    ctx.fillText(students[i].no+" "+students[i].name, 0, -textRadius);

    ctx.restore();
  }
}


draw();

function spin(){
let speed=0.3+Math.random()*0.3;
let timer=setInterval(()=>{
rotation+=speed;
speed*=0.98;

draw();

if(speed<0.002){
clearInterval(timer);

let index=Math.floor(
((2*Math.PI-rotation%(2*Math.PI))/angle)%size
);

let s=students[index];
document.getElementById("result").innerHTML=
`🎉 抽中：${s.name}（${s.id}）<br>职务：${s.job||"无"}`;
}
},20);
}
