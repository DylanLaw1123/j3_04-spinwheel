<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  font-family:"Microsoft YaHei",sans-serif;
  background:#f4f6f9;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

#wheel-container{
  position: relative;
  width:400px;
  height:400px;
}

canvas{
  border-radius:50%;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
}

/* pointer */
.pointer{
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%) rotate(180deg);
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid red;
  z-index:10;
}

button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* popup */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  visibility:hidden;
  opacity:0;
  transition:0.3s;
}

.popup.show{
  visibility:visible;
  opacity:1;
}

.popup-box{
  background:white;
  padding:40px 60px;
  border-radius:20px;
  font-size:28px;
  font-weight:bold;
  animation:pop 0.4s ease;
}

@keyframes pop{
  0%{transform:scale(0.3);}
  80%{transform:scale(1.1);}
  100%{transform:scale(1);}
}
</style>
</head>
<body>

<h1>🎡 抽签转盘</h1>

<div id="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
</div>

<button onclick="spin()">开始抽签</button>

<!-- popup -->
<div class="popup" id="popup" onclick="closePop()">
  <div class="popup-box" id="popText"></div>
</div>

<script>
const students=[
{no:1,name:"邱穆芸"},{no:2,name:"陈妍希"},{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},{no:5,name:"颜姿彤"},{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},{no:8,name:"陈钏宁"},{no:9,name:"李静恩"},
{no:10,name:"李开心"},{no:11,name:"刘瑞恩"},{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},{no:14,name:"陈姿卉"},{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},{no:17,name:"潘姿颖"},{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},{no:20,name:"戴湘霖"},{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},{no:23,name:"朱俊绅"},{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},{no:26,name:"张智勇"},{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},{no:29,name:"江致承"},{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},{no:32,name:"刘宽辅"},{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},{no:35,name:"伍思源"},{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},{no:38,name:"陈晋佑"},{no:39,name:"陈有权"},
{no:40,name:"余根权"},{no:41,name:"黄凯杰"},{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},{no:44,name:"黄明杰"},{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},{no:47,name:"杨仁喆"}
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = students.length;
const angle = 2*Math.PI/size;

let rotation=0, spinning=false, idle=true;

function draw(){
  ctx.clearRect(0,0,400,400);
  students.forEach((s,i)=>{
    ctx.beginPath();
    ctx.moveTo(200,200);
    ctx.fillStyle=`hsl(${i*360/size},80%,70%)`;
    ctx.arc(200,200,200,i*angle+rotation,(i+1)*angle+rotation);
    ctx.fill();

    ctx.save();
    ctx.translate(200,200);
    ctx.rotate(i*angle+angle/2+rotation);
    ctx.textAlign="right";
    ctx.font="14px Microsoft YaHei";
    ctx.fillStyle="#000";
    ctx.fillText(`${s.no} ${s.name}`,180,5);
    ctx.restore();
  });
}

/* idle slow spin */
function idleSpin(){
  if(!idle) return;
  rotation+=0.003;
  draw();
  requestAnimationFrame(idleSpin);
}

/* real spin */
function spin(){
  if(spinning) return;

  idle=false;
  spinning=true;

  let total=Math.random()*Math.PI*4+Math.PI*8;
  const start=performance.now();
  const dur=5000;

  function anim(t){
    let p=(t-start)/dur;
    if(p>1)p=1;

    rotation=total*(1-Math.pow(1-p,3));
    draw();

    if(p<1){
      requestAnimationFrame(anim);
    }else{
      spinning=false;

      let i=Math.floor(((1.5*Math.PI-rotation)%(2*Math.PI))/angle);
      if(i<0)i+=size;

      const s=students[i];
      showPop(`🎉 抽中：${s.no} ${s.name}`);
    }
  }
  requestAnimationFrame(anim);
}

/* popup */
function showPop(text){
  document.getElementById("popText").innerText=text;
  document.getElementById("popup").classList.add("show");
}

function closePop(){
  document.getElementById("popup").classList.remove("show");
}

draw();
idleSpin();
</script>

</body>
</html>
