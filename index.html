<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>抽签转盘</title>

<style>
body{
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  background:#111;
  color:white;
  font-family:"Microsoft YaHei";
}

h1{
  font-size:40px;
  margin-bottom:20px;
}

#wheelBox{
  position:relative;
}

#wheel{
  width:500px;
  height:500px;
  border-radius:50%;
  border:10px solid white;
}

.pointer{
  position:absolute;
  top:50%;
  left:100%;
  transform:translate(-5%,-50%) rotate(180deg);
  width:0;
  height:0;
  border-top:20px solid transparent;
  border-bottom:20px solid transparent;
  border-left:40px solid red;
}

button{
  margin-top:30px;
  padding:15px 50px;
  font-size:24px;
  border:none;
  border-radius:10px;
  background:#ff5252;
  color:white;
  cursor:pointer;
}

#resultBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:#222;
  padding:40px 80px;
  border-radius:20px;
  font-size:36px;
  color:#ffca28;
  box-shadow:0 0 30px rgba(0,0,0,.6);
  transition:.3s;
}

#resultBox.show{
  transform:translate(-50%,-50%) scale(1.1);
}
</style>
</head>

<body>

<h1>🎡 抽签转盘</h1>

<div id="wheelBox">
  <div id="wheel"></div>
  <div class="pointer"></div>
</div>

<button onclick="spin()">SPIN</button>

<div id="resultBox"></div>

<script>
const names=[
"邱穆芸","陈妍希","张芷欣","杨时瑜","颜姿彤","许亦萱",
"陈嘉恩","陈钏宁","李静恩","李开心","刘瑞恩","黄禹嫣",
"妮娅","陈姿卉","何汶宣","王歆茹","潘姿颖","施凯馨",
"陈渝恩","戴湘霖","王婧涵","许悦影","朱俊绅","陈毅祥",
"谢承邑","张智勇","何凯旭","赖家禾","江致承","刘俊祥",
"卢隽益","刘宽辅","卢裕城","黄康桀","伍思源","彭宇乐",
"潘家扬","陈晋佑","陈有权","余根权","黄凯杰","黄恩杰",
"黄俊熹","黄明杰","叶峻睿","叶礼诚","杨仁喆"
];

const wheel=document.getElementById("wheel");
const box=document.getElementById("resultBox");
let angle=0;

/* build wheel */
let deg=360/names.length;
let g=[];
for(let i=0;i<names.length;i++){
 let c=`hsl(${i*360/names.length},80%,55%)`;
 g.push(`${c} ${i*deg}deg ${(i+1)*deg}deg`);
}
wheel.style.background=`conic-gradient(${g.join(",")})`;

function spin(){
 box.classList.remove("show");

 let target=Math.random()*360+3600;
 let start=angle;
 let t=0;

 let timer=setInterval(()=>{
   t+=0.02;
   angle=start+(target-start)*(1-Math.pow(1-t,3));
   wheel.style.transform=`rotate(${angle}deg)`;

   if(t>=1){
     clearInterval(timer);
     showResult();
   }
 },16);
}

function showResult(){
 let size=360/names.length;
 let deg=(360-angle%360+90)%360;
 let index=Math.floor(deg/size);

 box.innerHTML="🎉 抽中："+names[index];
 box.classList.add("show");
}
</script>

</body>
</html>
