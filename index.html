<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

/* title */
h1{
  font-size:42px;
  margin-bottom:10px;
}

/* wheel container */
#wrapper{
  position:relative;
  width:700px;
  height:700px;
}

/* pointer (wheelofnames style) */
.pointer{
  position:absolute;
  right:-35px;
  top:50%;
  transform:translateY(-50%);
  width:0;
  height:0;
  border-top:25px solid transparent;
  border-bottom:25px solid transparent;
  border-left:45px solid #e53935;
  z-index:20;
}

/* wheel */
canvas{
  border-radius:50%;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* button */
button{
  margin-top:25px;
  padding:16px 55px;
  font-size:22px;
  border:none;
  border-radius:40px;
  background:#1976d2;
  color:white;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#125aa0;
}

/* result */
#result{
  margin-top:20px;
  font-size:46px;
  font-weight:800;
  opacity:0;
  transform:scale(.4);
  transition:.4s;
}

#result.show{
  opacity:1;
  transform:scale(1.1);
}
</style>
</head>
<body>

<h1>🎡 初三4 抽签转盘</h1>

<div id="wrapper">
  <div class="pointer"></div>
  <canvas id="wheel" width="700" height="700"></canvas>
</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
const students=[
{no:1,name:"邱穆芸"},{no:2,name:"陈妍希"},{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},{no:5,name:"颜姿彤"},{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},{no:8,name:"陈钏宁"},{no:9,name:"李静恩"},
{no:10,name:"李开心"},{no:11,name:"刘瑞恩"},{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},{no:14,name:"陈姿卉"},{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},{no:17,name:"潘姿颖"},{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},{no:20,name:"戴湘霖"},{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},{no:23,name:"朱俊绅"},{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},{no:26,name:"张智勇"},{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},{no:29,name:"江致承"},{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},{no:32,name:"刘宽辅"},{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},{no:35,name:"伍思源"},{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},{no:38,name:"陈晋佑"},{no:39,name:"陈有权"},
{no:40,name:"余根权"},{no:41,name:"黄凯杰"},{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},{no:44,name:"黄明杰"},{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},{no:47,name:"杨仁喆"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const r=canvas.width/2;

let angle=0;
let spinning=false;

/* draw */
function draw(){
  let per=2*Math.PI/students.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  students.forEach((s,i)=>{
    let a=angle+i*per;

    ctx.beginPath();
    ctx.moveTo(r,r);
    ctx.arc(r,r,r,a,a+per);
    ctx.fillStyle=`hsl(${i*360/students.length},85%,65%)`;
    ctx.fill();

    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(a+per/2);
    ctx.textAlign="right";
    ctx.fillStyle="#222";
    ctx.font="20px Segoe UI";
    ctx.fillText(`${s.no} ${s.name}`,r-22,8);
    ctx.restore();
  });
}

/* idle spin */
function idle(){
  if(!spinning){
    angle+=0.0015;
    draw();
  }
  requestAnimationFrame(idle);
}

/* spin */
function spin(){
  if(spinning) return;
  spinning=true;
  document.getElementById("result").className="";

  let speed=0.45;

  function go(){
    angle+=speed;
    speed*=0.985;
    draw();

    if(speed>0.002){
      requestAnimationFrame(go);
    }else{
      spinning=false;
      showResult();
    }
  }
  go();
}

/* result */
function showResult(){
  let per=2*Math.PI/students.length;
  let pointerAngle=0; // right side
  let idx=Math.floor(((2*Math.PI-angle+pointerAngle)%(2*Math.PI))/per);
  let s=students[idx];

  let rbox=document.getElementById("result");
  rbox.innerHTML=`🎉 抽中：${s.no} ${s.name}`;
  setTimeout(()=>rbox.className="show",50);
}

draw();
idle();
</script>

</body>
</html>
