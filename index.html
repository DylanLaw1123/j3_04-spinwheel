<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🎡 初三4 抽签转盘</title>

<style>
body{
  margin:0;
  font-family:"Microsoft YaHei",sans-serif;
  background:#f3f4f6;
  display:flex;
  height:100vh;
}

.left{
  flex:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.right{
  flex:1;
  background:white;
  padding:20px;
  overflow-y:auto;
}

h1{
  font-size:40px;
  margin-bottom:20px;
}

#wheelBox{
  position:relative;
}

#wheel{
  width:520px;
  height:520px;
  border-radius:50%;
  border:12px solid #333;
  transition:transform 4s cubic-bezier(.17,.67,.12,.99);
}

#pointer{
  position:absolute;
  right:-45px;
  top:50%;
  transform:translateY(-50%) rotate(180deg);
  width:0;height:0;
  border-top:18px solid transparent;
  border-bottom:18px solid transparent;
  border-left:35px solid red;
}

button{
  margin-top:30px;
  padding:18px 50px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{opacity:.85}

.list h2{
  text-align:center;
  margin-bottom:10px;
}

.list div{
  padding:6px;
  border-bottom:1px solid #eee;
  font-size:18px;
}

/* popup result on pointer */
#popup{
  position:absolute;
  display:none;
  background:#facc15;
  padding:10px 20px;
  border-radius:10px;
  font-size:22px;
  color:black;
  font-weight:bold;
  white-space:nowrap;
  transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div class="left">
<h1>🎡 初三4 抽签转盘</h1>

<div id="wheelBox">
<canvas id="wheel" width="520" height="520"></canvas>
<div id="pointer"></div>
<div id="popup"></div>
</div>

<button onclick="spin()">SPIN</button>
</div>

<div class="right list">
<h2>📋 名单</h2>
<div id="nameList"></div>
</div>

<script>
const students=[
{no:1,name:"邱穆芸"},{no:2,name:"陈妍希"},{no:3,name:"张芷欣"},
{no:4,name:"杨时瑜"},{no:5,name:"颜姿彤"},{no:6,name:"许亦萱"},
{no:7,name:"陈嘉恩"},{no:8,name:"陈钏宁"},{no:9,name:"李静恩"},
{no:10,name:"李开心"},{no:11,name:"刘瑞恩"},{no:12,name:"黄禹嫣"},
{no:13,name:"妮娅"},{no:14,name:"陈姿卉"},{no:15,name:"何汶宣"},
{no:16,name:"王歆茹"},{no:17,name:"潘姿颖"},{no:18,name:"施凯馨"},
{no:19,name:"陈渝恩"},{no:20,name:"戴湘霖"},{no:21,name:"王婧涵"},
{no:22,name:"许悦影"},{no:23,name:"朱俊绅"},{no:24,name:"陈毅祥"},
{no:25,name:"谢承邑"},{no:26,name:"张智勇"},{no:27,name:"何凯旭"},
{no:28,name:"赖家禾"},{no:29,name:"江致承"},{no:30,name:"刘俊祥"},
{no:31,name:"卢隽益"},{no:32,name:"刘宽辅"},{no:33,name:"卢裕城"},
{no:34,name:"黄康桀"},{no:35,name:"伍思源"},{no:36,name:"彭宇乐"},
{no:37,name:"潘家扬"},{no:38,name:"陈晋佑"},{no:39,name:"陈有权"},
{no:40,name:"余根权"},{no:41,name:"黄凯杰"},{no:42,name:"黄恩杰"},
{no:43,name:"黄俊熹"},{no:44,name:"黄明杰"},{no:45,name:"叶峻睿"},
{no:46,name:"叶礼诚"},{no:47,name:"杨仁喆"}
];

const wheel=document.getElementById("wheel");
const ctx=wheel.getContext("2d");
const popup=document.getElementById("popup");
const size=students.length;
const angle=2*Math.PI/size;
let current=0;
let spinning=false;

/* draw wheel */
function draw(){
  for(let i=0;i<size;i++){
    ctx.beginPath();
    ctx.moveTo(260,260);
    ctx.fillStyle=i%2?"#60a5fa":"#93c5fd";
    ctx.arc(260,260,260,i*angle,(i+1)*angle);
    ctx.fill();

    ctx.save();
    ctx.translate(260,260);
    ctx.rotate(i*angle+angle/2);
    ctx.textAlign="right";
    ctx.fillStyle="#000";
    ctx.font="18px Microsoft YaHei";
    ctx.fillText(students[i].no+" "+students[i].name,240,6);
    ctx.restore();
  }
}
draw();

/* right list */
let nameList=document.getElementById("nameList");
students.forEach(s=>{
  nameList.innerHTML+=`${s.no} ${s.name}<br>`;
});

function spin(){
  if(spinning) return;
  spinning=true;
  popup.style.display="none";

  let win=Math.floor(Math.random()*size);
  let deg=360*6 - win*(360/size) - (360/(size*2));
  current+=deg;
  wheel.style.transform=`rotate(${current}deg)`;

  setTimeout(()=>{
    let rect=wheel.getBoundingClientRect();
    let x=rect.right;       // pointer x
    let y=rect.top + rect.height/2; // pointer y
    popup.style.left=x+"px";
    popup.style.top=y+"px";
    popup.innerHTML=`🎉 抽中：${students[win].no} ${students[win].name}`;
    popup.style.display="block";
    spinning=false;
  },4000);
}
</script>
</body>
</html>
