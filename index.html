<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>初三4 抽签转盘</title>

<style>
body{
  font-family:"Microsoft YaHei",sans-serif;
  background:#f4f6f9;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{margin-bottom:10px;}

#wheel-container{
  position: relative;
  width:400px;
  height:400px;
}

canvas{
  border-radius:50%;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
}

/* Pointer outside the wheel, pointing down */
.pointer{
  position:absolute;
  top:-20px;       /* above the wheel */
  left:50%;
  transform:translateX(-50%) rotate(180deg); /* rotate downward */
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid red; /* arrow points down */
  z-index:10;
}

button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{opacity:0.9;}

#result{
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}
</style>
</head>
<body>

<h1>初三4 抽签转盘</h1>

<div id="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
</div>

<button onclick="spin()">开始抽签</button>

<div id="result"></div>

<script>
const students=[
{no:1,name:"邱穆芸",id:"242154"},
{no:2,name:"陈妍希",id:"242159"},
{no:3,name:"张芷欣",id:"242156"},

{no:5,name:"颜姿彤",id:"242163"},

{no:7,name:"陈嘉恩",id:"242168"},
{no:8,name:"陈钏宁",id:"242155"},
{no:9,name:"李静恩",id:"242158"},
{no:10,name:"李开心",id:"240009"},
{no:11,name:"刘瑞恩",id:"242160"},
{no:12,name:"黄禹嫣",id:"242164"},
{no:13,name:"妮娅",id:"242166"},
{no:14,name:"陈姿卉",id:"242162"},
{no:15,name:"何汶宣",id:"242165"},

{no:17,name:"潘姿颖",id:"242147"},
{no:18,name:"施凯馨",id:"242150"},
{no:19,name:"陈渝恩",id:"242148"},
{no:20,name:"戴湘霖",id:"242157"},
{no:21,name:"王婧涵",id:"242152"},
{no:22,name:"许悦影",id:"242167"},
{no:23,name:"朱俊绅",id:"242189"},

{no:25,name:"谢承邑",id:"242190"},

{no:29,name:"江致承",id:"242171"},

{no:31,name:"卢隽益",id:"242187"},
{no:32,name:"刘宽辅",id:"242170"},
{no:33,name:"卢裕城",id:"242188"},

{no:46,name:"叶礼诚",id:"242172"},
{no:47,name:"杨仁喆",id:"242184"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const size=students.length;
const angle=2*Math.PI/size;
let rotation=0;

function draw(){
  ctx.clearRect(0,0,400,400);
  students.forEach((s,i)=>{
    ctx.beginPath();
    ctx.moveTo(200,200);
    ctx.fillStyle=`hsl(${i*360/size},80%,70%)`;
    ctx.arc(200,200,200,i*angle+rotation,(i+1)*angle+rotation);
    ctx.fill();

    ctx.save();
    ctx.translate(200,200);
    ctx.rotate(i*angle+angle/2+rotation);
    ctx.textAlign="right";
    ctx.fillStyle="#000";
    ctx.font="14px Microsoft YaHei";
    ctx.fillText(`${s.no} ${s.name}`,180,5);
    ctx.restore();
  });
}

draw();

function spin(){
  let speed=0.3+Math.random()*0.3;
  let timer=setInterval(()=>{
    rotation+=speed;
    speed*=0.98;

    draw();

    if(speed<0.002){
      clearInterval(timer);

      // calculate slice under pointer (top of wheel)
      let index=Math.floor(
        ((1.5*Math.PI-rotation)%(2*Math.PI))/angle
      );
      if(index<0) index+=size;

      let s=students[index];
      document.getElementById("result").innerHTML=
        `🎉 抽中：${s.no} ${s.name}（${s.id}）`;
    }
  },20);
}
</script>

</body>
</html>
